<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flare External | Premium</title>
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="dark-theme">
    <div id="particles-js"></div>

    <nav class="navbar">
        <div class="logo">FLARE</div>
        <div class="nav-right">
            <button class="theme-toggle-btn" id="theme-btn">
                <i class="fas fa-sun active"></i>
                <i class="fas fa-moon"></i>
            </button>
            <a href="index.html" class="nav-item active"><i class="fas fa-home"></i></a>
            <button class="nav-item-btn" id="profile-open"><i class="fas fa-user-circle"></i></button>
        </div>
    </nav>

    <section class="hero-section">
        <div class="container hero-content fade-in-left">
            <h1 class="hero-title">Улучши свою игру с<br><span class="accent">Flare cheat.</span></h1>
            <div class="button-group" id="main-btns">
                <button class="btn-happ-style" id="buy-trigger"><i class="fas fa-bolt"></i> Приобрести</button>
                <a href="about.html" class="btn-outline-minimal">О нас</a>
            </div>

            <div id="payment-menu" class="liquid-glass-panel hidden">
                <button class="back-payment" id="back-to-main"><i class="fas fa-arrow-left"></i> Назад</button>
                <div class="payment-options">
                    <div class="pay-item"><i class="fas fa-university"></i> СБП</div>
                    <div class="pay-item"><i class="fas fa-exchange-alt"></i> ПЕРЕВОД</div>
                    <div class="pay-item"><i class="fas fa-coins"></i> USDT</div>
                </div>
            </div>
        </div>
    </section>

    <div class="modal" id="profile-modal">
        <div class="modal-content glass-effect">
            <button class="close-btn" id="close-profile">&times;</button>
            <div id="login-form">
                <h2 class="modal-title">Вход</h2>
                <input type="text" placeholder="Логин" class="soda-input">
                <input type="password" placeholder="Пароль" class="soda-input">
                <button class="btn-happ-style" style="width: 100%; justify-content: center;" id="login-btn">Войти</button>
            </div>
            <div id="user-cabinet" class="hidden">
                <div class="key-card">
                    <span class="label">ВАШ КЛЮЧ:</span>
                    <div class="key-value">FLARE-XXXX-V3-FREE</div>
                </div>
                <div class="expiry-info">KEY EXPIRED: <span class="expiry-timer">14:22:05:01</span></div>
                <p class="wish-text">УДАЧИ В ИСПОЛЬЗОВАНИИ!</p>
            </div>
        </div>
    </div>

    <script>
        // Логика переключения меню оплаты
        const buyBtn = document.getElementById('buy-trigger');
        const backBtn = document.getElementById('back-to-main');
        const mainBtns = document.getElementById('main-btns');
        const payMenu = document.getElementById('payment-menu');

        buyBtn.onclick = () => {
            mainBtns.classList.add('hidden');
            payMenu.classList.remove('hidden');
            payMenu.classList.add('fade-in-up');
        };

        backBtn.onclick = () => {
            payMenu.classList.add('hidden');
            mainBtns.classList.remove('hidden');
        };

        // Тема (Солнце/Луна)
        const themeBtn = document.getElementById('theme-btn');
        themeBtn.onclick = () => {
            document.body.classList.toggle('light-theme');
            themeBtn.querySelectorAll('i').forEach(i => i.classList.toggle('active'));
        };

        // Профиль
        const modal = document.getElementById('profile-modal');
        document.getElementById('profile-open').onclick = () => modal.style.display = "flex";
        document.getElementById('close-profile').onclick = () => modal.style.display = "none";
        document.getElementById('login-btn').onclick = () => {
            document.getElementById('login-form').classList.add('hidden');
            document.getElementById('user-cabinet').classList.remove('hidden');
        };

        particlesJS('particles-js', {
            "particles": { "number": { "value": 80 }, "line_linked": { "enable": true, "opacity": 0.2 }, "move": { "speed": 1 } }
        });
    </script>
</body>
</html>
