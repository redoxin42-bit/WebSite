<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flare Cheat</title>
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="dark-theme">
    <div id="particles-js"></div>

    <nav class="navbar">
        <div class="logo">FLARE</div>
        <div class="nav-right">
            <div class="theme-switch" id="theme-btn">
                <div class="switch-circle"></div>
            </div>
            <a href="about.html" class="func-btn">ФУНКЦИОНАЛ</a>
        </div>
    </nav>

    <div class="container">
        <section class="hero">
            <h1 class="hero-title">
                Улучши свою игру с<br>
                <span class="accent">Flare cheat.</span>
            </h1>
            
            <div class="button-group">
                <button class="btn-main" id="buy-trigger">Приобрести</button>
                <a href="about.html" class="btn-outline">О нас</a>
            </div>
        </section>
    </div>

    <script>
        const themeBtn = document.getElementById('theme-btn');
        themeBtn.addEventListener('click', () => {
            document.body.classList.toggle('light-theme');
            themeBtn.classList.toggle('active');
        });

        particlesJS('particles-js', {
            "particles": {
                "number": { "value": 50 },
                "shape": { "type": "triangle" },
                "color": { "value": "#ffffff" },
                "line_linked": { "enable": true, "opacity": 0.15 },
                "move": { "speed": 1 }
            }
        });
    </script>
</body>
</html>
