<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flare External | Premium</title>
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="dark-theme">
    <div id="particles-js"></div>

    <nav class="navbar">
        <div class="logo">FLARE</div>
        <div class="nav-right">
            <button class="theme-toggle" id="theme-btn"><i class="fas fa-sun"></i></button>
            <a href="index.html" class="nav-item active"><i class="fas fa-home"></i></a>
            <a href="#" class="nav-item"><i class="fas fa-user-circle"></i></a>
        </div>
    </nav>

    <div class="container hero">
        <div class="hero-content fade-in-up">
            <h1 class="hero-title">
                Улучши свою игру с<br>
                <span class="accent">Flare cheat.</span>
            </h1>
            
            <div class="button-group">
                <button class="btn-purchase" id="buy-trigger">Приобрести</button>
                <a href="about.html" class="btn-secondary">О нас</a>
            </div>

            <div id="payment-methods" class="payment-methods hidden">
                <div class="payment-panel"><i class="fas fa-university"></i> СБП</div>
                <div class="payment-panel"><i class="fas fa-credit-card"></i> КАРТА</div>
            </div>
        </div>
    </div>

    <script>
        // Меню оплаты
        document.getElementById('buy-trigger').addEventListener('click', function() {
            document.getElementById('payment-methods').classList.toggle('show');
            this.parentElement.style.opacity = '0';
        });

        // ЛОГИКА АНИМАЦИИ НАЖАТИЯ НА ФОН
        particlesJS('particles-js', {
            "particles": {
                "number": { "value": 80, "density": { "enable": true, "value_area": 800 } },
                "color": { "value": "#ffffff" },
                "shape": { "type": "circle" },
                "opacity": { "value": 0.5 },
                "size": { "value": 2, "random": true },
                "line_linked": { 
                    "enable": true, 
                    "distance": 150, 
                    "color": "#ffffff", 
                    "opacity": 0.3, 
                    "width": 1 
                },
                "move": { "enable": true, "speed": 1, "direction": "none", "out_mode": "out" }
            },
            "interactivity": {
                "detect_on": "canvas",
                "events": {
                    "onclick": { "enable": true, "mode": "push" }, // При клике "выплескивает" новые частицы
                    "onhover": { "enable": true, "mode": "grab" }
                }
            },
            "retina_detect": true
        });
    </script>
</body>
</html>
