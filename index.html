<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flare Cheat | Premium</title>
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="dark-theme">
    <div id="particles-js"></div>

    <nav class="navbar">
        <div class="nav-left">FLARE</div>
        <div class="nav-right">
            <button class="theme-toggle" id="theme-btn"><i class="fas fa-sun"></i></button>
            <a href="#" class="nav-link">ГЛАВНАЯ</a>
            <a href="about.html" class="nav-link">О НАС</a>
            <a href="about.html" class="download-btn">ФУНКЦИОНАЛ</a>
        </div>
    </nav>

    <div class="container">
        <section class="hero">
            <div class="hero-content">
                <h1 class="main-title">Улучши свою игру с <br><span>Flare cheat.</span></h1>
                <div class="action-row">
                    <button class="btn-primary" id="buy-trigger">Приобрести</button>
                    <a href="about.html" class="btn-secondary">О нас</a>
                </div>
            </div>
        </section>

        <div id="payment-methods" class="hidden">
            <div class="payment-panel"><i class="fas fa-university"></i> СБП</div>
            <div class="payment-panel"><i class="fas fa-credit-card"></i> КАРТА</div>
            <div class="payment-panel"><i class="fas fa-exchange-alt"></i> ПЕРЕВОД</div>
        </div>

        <section class="function-section">
            <h2 class="section-title">Flare Function</h2>
            <p class="no-func">Функций пока нет.</p>
        </section>
    </div>

    <script>
        document.getElementById('buy-trigger').addEventListener('click', function() {
            document.getElementById('payment-methods').classList.toggle('show');
            this.parentElement.style.opacity = '0';
        });

        // Настройка треугольников как в видео
        particlesJS('particles-js', {
            "particles": {
                "number": { "value": 40 },
                "shape": { "type": "triangle" },
                "color": { "value": "#ffffff" },
                "opacity": { "value": 0.2 },
                "size": { "value": 3 },
                "line_linked": { "enable": true, "distance": 150, "color": "#ffffff", "opacity": 0.2, "width": 1 },
                "move": { "enable": true, "speed": 1.2 }
            }
        });
    </script>
</body>
</html>
