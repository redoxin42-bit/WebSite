<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flare External | Premium</title>
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://unpkg.com/scrollreveal"></script>
</head>
<body class="dark-theme">
    <div id="particles-js"></div>

    <nav class="navbar">
        <div class="logo">FLARE</div>
        <div class="nav-right">
            <button class="theme-toggle" id="theme-btn"><i class="fas fa-sun"></i></button>
            <a href="index.html" class="nav-item active"><i class="fas fa-home"></i></a>
            <a href="#" class="nav-item"><i class="fas fa-user-circle"></i></a>
        </div>
    </nav>

    <section class="hero-section">
        <div class="container hero-content fade-in-left">
            <h1 class="hero-title">
                Улучши свою игру с<br>
                <span class="accent">Flare cheat.</span>
            </h1>
            
            <div class="button-group">
                <button class="btn-happ-style" id="buy-trigger">
                    <i class="fas fa-bolt"></i> Приобрести
                </button>
                <a href="about.html" class="btn-outline-minimal">О нас</a>
            </div>
        </div>
    </section>

    <section class="functions-section" id="functions">
        <div class="container">
            <h2 class="section-subtitle">Premium Features</h2>
            <div class="function-grid">
                <div class="func-card reveal">
                    <i class="fas fa-crosshairs"></i>
                    <h3>Aimbot</h3>
                    <p>Smooth prediction & custom FOV</p>
                </div>
                <div class="func-card reveal">
                    <i class="fas fa-eye"></i>
                    <h3>Visuals</h3>
                    <p>ESP Box, Skeleton, Distance</p>
                </div>
                <div class="func-card reveal">
                    <i class="fas fa-shield-alt"></i>
                    <h3>Misc</h3>
                    <p>No Recoil, No Spread, Movement</p>
                </div>
            </div>
            <p class="status-badge">Status: <span class="green">Undetected</span></p>
        </div>
    </section>

    <script>
        // Настройка анимации скролла
        ScrollReveal().reveal('.reveal', { 
            delay: 200, distance: '50px', origin: 'bottom', interval: 100 
        });

        // Переключение тем с сохранением созвездия
        const themeBtn = document.getElementById('theme-btn');
        themeBtn.onclick = () => {
            document.body.classList.toggle('light-theme');
            const isLight = document.body.classList.contains('light-theme');
            // Обновляем цвет частиц динамически
            window.pJSDom[0].pJS.particles.color.value = isLight ? "#000000" : "#ffffff";
            window.pJSDom[0].pJS.particles.line_linked.color = isLight ? "#000000" : "#ffffff";
            window.pJSDom[0].pJS.fn.particlesRefresh();
        };

        // Созвездие
        particlesJS('particles-js', {
            "particles": {
                "number": { "value": 90 },
                "color": { "value": "#ffffff" },
                "shape": { "type": "circle" },
                "size": { "value": 2 },
                "line_linked": { "enable": true, "distance": 150, "color": "#ffffff", "opacity": 0.3, "width": 1 },
                "move": { "enable": true, "speed": 1.5 }
            },
            "interactivity": { "events": { "onclick": { "enable": true, "mode": "push" }, "onhover": { "enable": true, "mode": "grab" } } }
        });
    </script>
</body>
</html>
