<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flare External | Standoff 2</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="dark-theme">
    <div id="particles-js"></div>

    <nav class="navbar">
        <div class="logo">FLARE</div>
        <div class="nav-right">
            <button class="icon-btn theme-toggle" id="theme-btn">
                <i class="fas fa-sun active"></i>
                <i class="fas fa-moon"></i>
            </button>
            <a href="index.html" class="icon-btn active"><i class="fas fa-home"></i></a>
            <button class="icon-btn" id="profile-open"><i class="fas fa-user-circle"></i></button>
            <a href="#functional-section" class="nav-text-link">ФУНКЦИОНАЛ</a>
        </div>
    </nav>

    <main class="main-wrapper">
        <section class="hero-section">
            <div class="hero-content fade-in-up">
                <h1 class="hero-title">Улучши свою игру с <br><span class="accent">Flare cheat.</span></h1>
                <div class="btn-group">
                    <button id="btn-buy" class="btn-primary"><i class="fas fa-bolt"></i> Приобрести</button>
                    <a href="about.html" class="btn-secondary">О нас</a>
                </div>
            </div>
        </section>

        <section id="functional-section" class="functional-container fade-in-up">
            <div class="liquid-card func-card">
                <h2 class="section-title">Функционал</h2>
                <div class="func-grid">
                    <div class="func-item">
                        <i class="fas fa-crosshairs"></i>
                        <div class="func-text">
                            <h4>Aimbot</h4>
                            <p>Silent, Smooth, FOV</p>
                        </div>
                    </div>
                    <div class="func-item">
                        <i class="fas fa-eye"></i>
                        <div class="func-text">
                            <h4>Visuals</h4>
                            <p>Boxes, Skeletons, HP</p>
                        </div>
                    </div>
                    <div class="func-item">
                        <i class="fas fa-tshirt"></i>
                        <div class="func-text">
                            <h4>Skins</h4>
                            <p>All Knives & Gloves</p>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <div id="payment-modal" class="modal">
        <div class="liquid-card payment-box">
            <button class="close-modal" id="close-pay">&times;</button>
            <h3>Выберите способ оплаты</h3>
            <div class="pay-list">
                <div class="pay-item"><i class="fas fa-mobile-alt"></i> СБП</div>
                <div class="pay-item"><i class="fas fa-credit-card"></i> КАРТА</div>
                <div class="pay-item"><i class="fab fa-ethereum"></i> USDT</div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script>
        // Конфигурация созвездий
        particlesJS("particles-js", {
            "particles": {
                "number": { "value": 90, "density": { "enable": true, "value_area": 800 } },
                "color": { "value": "#ffffff" },
                "shape": { "type": "circle" },
                "opacity": { "value": 0.3 },
                "size": { "value": 2 },
                "line_linked": { "enable": true, "distance": 150, "color": "#ffffff", "opacity": 0.2, "width": 1 },
                "move": { "enable": true, "speed": 1.5 }
            }
        });

        // Логика кнопок
        const themeBtn = document.getElementById('theme-btn');
        themeBtn.onclick = () => {
            document.body.classList.toggle('light-theme');
            themeBtn.querySelectorAll('i').forEach(i => i.classList.toggle('active'));
        };

        const payModal = document.getElementById('payment-modal');
        document.getElementById('btn-buy').onclick = () => payModal.style.display = "flex";
        document.getElementById('close-pay').onclick = () => payModal.style.display = "none";
    </script>
</body>
</html>
