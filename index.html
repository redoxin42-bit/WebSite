<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flare External</title>
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div id="particles-js"></div>

    <div class="container">
        <h1 class="title">FLARE EXTERNAL</h1>

        <div class="payment-panel">
            <div class="icon-box"><i class="fas fa-university"></i></div>
            <div class="panel-text">СБП</div>
        </div>

        <div class="payment-panel">
            <div class="icon-box"><i class="fas fa-credit-card"></i></div>
            <div class="panel-text">КАРТА</div>
        </div>

        <div class="payment-panel">
            <div class="icon-box"><i class="fas fa-exchange-alt"></i></div>
            <div class="panel-text">ПЕРЕВОД</div>
        </div>

        <button class="buy-btn">
            <i class="fas fa-wand-magic-sparkles"></i>
            BUY CHEAT
        </button>

        <a href="about.html" class="about-link">About us</a>
    </div>

    <script>
        particlesJS('particles-js', {
            "particles": {
                "number": { "value": 60, "density": { "enable": true, "value_area": 800 } },
                "color": { "value": "#ffffff" },
                "shape": { "type": "circle" },
                "opacity": { "value": 0.3 },
                "size": { "value": 2 },
                "line_linked": { "enable": true, "distance": 150, "color": "#ffffff", "opacity": 0.2, "width": 1 },
                "move": { "enable": true, "speed": 1.5 }
            }
        });
    </script>
</body>
</html>
