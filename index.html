<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flare External</title>
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div id="particles-js"></div>

    <div class="container">
        <h1 class="title">FLARE EXTERNAL</h1>

        <div id="payment-methods" class="hidden">
            <div class="payment-panel">
                <div class="icon-box"><i class="fas fa-university"></i></div>
                <div class="panel-text">СБП</div>
            </div>
            <div class="payment-panel">
                <div class="icon-box"><i class="fas fa-credit-card"></i></div>
                <div class="panel-text">КАРТА</div>
            </div>
            <div class="payment-panel">
                <div class="icon-box"><i class="fas fa-exchange-alt"></i></div>
                <div class="panel-text">ПЕРЕВОД</div>
            </div>
        </div>

        <button class="buy-btn" id="buy-trigger">
            <i class="fas fa-wand-magic-sparkles"></i>
            BUY CHEAT
        </button>

        <a href="about.html" class="about-link">Function</a>
    </div>

    <script>
        // Логика появления меню
        document.getElementById('buy-trigger').addEventListener('click', function() {
            const methods = document.getElementById('payment-methods');
            methods.classList.toggle('show');
            this.style.display = 'none'; // Прячем кнопку после нажатия, как в приложениях
        });

        particlesJS('particles-js', {
            "particles": {
                "number": { "value": 60 },
                "color": { "value": "#ffffff" },
                "line_linked": { "enable": true, "distance": 150, "opacity": 0.2 },
                "move": { "enable": true, "speed": 1.5 }
            }
        });
    </script>
</body>
</html>
