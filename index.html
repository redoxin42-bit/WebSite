<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flare Cheat | Main</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div id="particles-js"></div>

    <nav class="navbar">
        <div class="logo">FLARE<span>⚙️</span></div>
        <div class="nav-links">
            <a href="index.html" class="active">ГЛАВНАЯ</a>
            <a href="about.html">О НАС</a>
            <button class="func-btn">ФУНКЦИОНАЛ</button>
        </div>
    </nav>

    <main class="container">
        <div id="hero-content" class="menu-section">
            <h1 class="hero-title">Улучши свою игру с <br><span class="accent">Flare cheat.</span></h1>
            <div class="btn-group">
                <button id="btn-buy" class="btn-primary">Приобрести</button>
                <a href="about.html" class="btn-secondary">О нас</a>
            </div>
        </div>

        <div id="payment-content" class="menu-section hidden">
            <div class="glass-card payment-card">
                <button id="btn-back" class="back-link"><i class="fas fa-arrow-left"></i> Назад</button>
                <h2>Выберите способ оплаты</h2>
                <div class="payment-methods">
                    <div class="method-item">
                        <i class="fas fa-mobile-alt"></i>
                        <span>СБП</span>
                    </div>
                    <div class="method-item">
                        <i class="fas fa-credit-card"></i>
                        <span>ПЕРЕВОД</span>
                    </div>
                    <div class="method-item">
                        <i class="fab fa-ethereum"></i>
                        <span>USDT (TRC20)</span>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script>
        /* Конфигурация созвездий (тонкие линии) */
        particlesJS("particles-js", {
            "particles": {
                "number": { "value": 80, "density": { "enable": true, "value_area": 800 } },
                "color": { "value": "#ffffff" },
                "shape": { "type": "circle" },
                "opacity": { "value": 0.5, "random": false },
                "size": { "value": 2, "random": true },
                "line_linked": { "enable": true, "distance": 150, "color": "#ffffff", "opacity": 0.2, "width": 1 },
                "move": { "enable": true, "speed": 2, "direction": "none", "random": false, "straight": false, "out_mode": "out", "bounce": false }
            },
            "interactivity": {
                "detect_on": "canvas",
                "events": { "onhover": { "enable": true, "mode": "grab" }, "onclick": { "enable": true, "mode": "push" } },
                "modes": { "grab": { "distance": 140, "line_linked": { "opacity": 1 } } }
            },
            "retina_detect": true
        });

        // Логика переключения меню
        const btnBuy = document.getElementById('btn-buy');
        const btnBack = document.getElementById('btn-back');
        const hero = document.getElementById('hero-content');
        const payment = document.getElementById('payment-content');

        btnBuy.addEventListener('click', () => {
            hero.classList.add('hidden');
            payment.classList.remove('hidden');
        });

        btnBack.addEventListener('click', () => {
            payment.classList.add('hidden');
            hero.classList.remove('hidden');
        });
    </script>
</body>
</html>
