<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flare External</title>
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="dark-theme"> <div id="particles-js"></div>

    <nav class="navbar">
        <div class="nav-right">
            <button class="theme-toggle" id="theme-btn">
                <i class="fas fa-sun" id="theme-icon"></i>
            </button>
            <a href="#" class="nav-item"><i class="fas fa-cog"></i></a>
            <a href="#" class="nav-item"><i class="fas fa-user-circle"></i></a>
            <a href="index.html" class="nav-item active">Home</a>
        </div>
    </nav>

    <div class="container">
        <h1 class="title">FLARE EXTERNAL</h1>

        <div id="payment-methods" class="hidden">
            <div class="payment-panel">
                <div class="icon-box"><i class="fas fa-university"></i></div>
                <div class="panel-text">СБП</div>
            </div>
            <div class="payment-panel">
                <div class="icon-box"><i class="fas fa-credit-card"></i></div>
                <div class="panel-text">КАРТА</div>
            </div>
            <div class="payment-panel">
                <div class="icon-box"><i class="fas fa-exchange-alt"></i></div>
                <div class="panel-text">ПЕРЕВОД</div>
            </div>
        </div>

        <button class="buy-btn" id="buy-trigger">
            <i class="fas fa-wand-magic-sparkles"></i>
            BUY CHEAT
        </button>

        <a href="about.html" class="about-link">Function</a>
    </div>

    <script>
        // Логика кнопки покупки
        document.getElementById('buy-trigger').addEventListener('click', function() {
            const methods = document.getElementById('payment-methods');
            methods.classList.toggle('show');
            this.style.display = 'none';
        });

        // ЛОГИКА СМЕНЫ ТЕМЫ
        const themeBtn = document.getElementById('theme-btn');
        const themeIcon = document.getElementById('theme-icon');
        const body = document.body;

        themeBtn.addEventListener('click', () => {
            body.classList.toggle('light-theme');
            body.classList.toggle('dark-theme');
            
            if (body.classList.contains('light-theme')) {
                themeIcon.classList.replace('fa-sun', 'fa-moon');
                updateParticles('#cccccc'); // Серые линии для светлой темы
            } else {
                themeIcon.classList.replace('fa-moon', 'fa-sun');
                updateParticles('#ffffff'); // Белые для темной
            }
        });

        function updateParticles(color) {
            window.pJSDom[0].pJS.particles.color.value = color;
            window.pJSDom[0].pJS.particles.line_linked.color = color;
            window.pJSDom[0].pJS.fn.particlesRefresh();
        }

        particlesJS('particles-js', {
            "particles": {
                "number": { "value": 80 },
                "color": { "value": "#ffffff" },
                "size": { "value": 2 },
                "line_linked": { "enable": true, "distance": 150, "color": "#ffffff", "opacity": 0.3, "width": 1 },
                "move": { "enable": true, "speed": 1 }
            },
            "interactivity": { "events": { "onhover": { "enable": true, "mode": "grab" } } },
            "retina_detect": true
        });
    </script>
</body>
</html>
