<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flare | Function</title>
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="dark-theme">
    <div id="particles-js"></div>

    <nav class="navbar">
        <div class="nav-right">
            <button class="theme-toggle" id="theme-btn">
                <i class="fas fa-sun" id="theme-icon"></i>
            </button>
            <a href="#" class="nav-item"><i class="fas fa-cog"></i></a>
            <a href="#" class="nav-item"><i class="fas fa-user-circle"></i></a>
            <a href="index.html" class="nav-item">Home</a>
        </div>
    </nav>
    
    <div class="container">
        <h1 class="title-small">FUNCTIONALITY</h1>
        
        <div class="func-card">
            <div class="icon-box-small"><i class="fas fa-crosshairs"></i></div>
            <div>
                <h3>Aimbot</h3>
                <p>Smooth prediction & custom FOV</p>
            </div>
        </div>

        <div class="func-card">
            <div class="icon-box-small"><i class="fas fa-eye"></i></div>
            <div>
                <h3>Visuals</h3>
                <p>ESP Box, Skeleton, Distance</p>
            </div>
        </div>

        <div class="func-card">
            <div class="icon-box-small"><i class="fas fa-bolt"></i></div>
            <div>
                <h3>Misc</h3>
                <p>No Recoil, No Spread, Movement</p>
            </div>
        </div>

        <p class="status-tag">Status: <span class="online">Undetected</span></p>

        <a href="index.html" class="back-btn">← Back to Home</a>
    </div>

    <script>
        // ЛОГИКА СМЕНЫ ТЕМЫ
        const themeBtn = document.getElementById('theme-btn');
        const themeIcon = document.getElementById('theme-icon');
        const body = document.body;

        themeBtn.addEventListener('click', () => {
            body.classList.toggle('light-theme');
            body.classList.toggle('dark-theme');
            
            if (body.classList.contains('light-theme')) {
                themeIcon.classList.replace('fa-sun', 'fa-moon');
                updateParticles('#666666'); // Темно-серые линии для светлой темы
            } else {
                themeIcon.classList.replace('fa-moon', 'fa-sun');
                updateParticles('#ffffff'); // Белые для темной
            }
        });

        function updateParticles(color) {
            if(window.pJSDom && window.pJSDom[0]) {
                window.pJSDom[0].pJS.particles.color.value = color;
                window.pJSDom[0].pJS.particles.line_linked.color = color;
                window.pJSDom[0].pJS.fn.particlesRefresh();
            }
        }

        // ТОТ САМЫЙ ФОН (СОЗВЕЗДИЕ)
        particlesJS('particles-js', {
            "particles": {
                "number": { "value": 80, "density": { "enable": true, "value_area": 800 } },
                "color": { "value": "#ffffff" },
                "shape": { "type": "circle" },
                "opacity": { "value": 0.5 },
                "size": { "value": 2, "random": true },
                "line_linked": { 
                    "enable": true, 
                    "distance": 150, 
                    "color": "#ffffff", 
                    "opacity": 0.3, 
                    "width": 1 
                },
                "move": { "enable": true, "speed": 1, "direction": "none", "out_mode": "out" }
            },
            "interactivity": { "events": { "onhover": { "enable": true, "mode": "grab" } } },
            "retina_detect": true
        });
    </script>
</body>
</html>
