<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flare | О нас</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div id="particles-js"></div>
    <nav class="navbar">
        <div class="logo">FLARE</div>
        <div class="nav-right">
            <a href="index.html" class="icon-btn"><i class="fas fa-home"></i></a>
        </div>
    </nav>

    <main class="container-center">
        <div class="liquid-card about-card fade-in-up">
            <h1>О проекте <span class="accent">Flare</span></h1>
            <p>Flare — это приватный софт для Standoff 2, созданный для тех, кто ценит безопасность и качество. Наша External-технология позволяет использовать чит без внедрения в файлы игры.</p>
            <div class="stats">
                <div class="stat"><span>100%</span><br>Safe</div>
                <div class="stat"><span>24/7</span><br>Support</div>
                <div class="stat"><span>Undetect</span><br>Status</div>
            </div>
            <a href="index.html" class="btn-primary">Вернуться на главную</a>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <script>
        particlesJS("particles-js", { "particles": { "number": { "value": 70 }, "line_linked": { "enable": true, "opacity": 0.2 }, "move": { "speed": 1 } } });
    </script>
</body>
</html>
