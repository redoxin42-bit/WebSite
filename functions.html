<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flare | Functions</title>
    <script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="dark-theme page-functions">
    <div id="particles-js"></div>

    <nav class="navbar">
        <div class="logo">FLARE</div>
        <div class="nav-right">
            <button class="theme-toggle" id="theme-toggle"><i class="fas fa-sun"></i></button>
            <a href="index.html" class="nav-item"><i class="fas fa-home"></i></a>
            <a href="#" class="nav-item"><i class="fas fa-user-circle"></i></a>
        </div>
    </nav>
    
    <div class="container content-centered fade-in-up">
        <h1 class="page-title">Flare Function</h1>
        
        <div class="function-grid">
            <div class="func-card">
                <i class="fas fa-crosshairs"></i>
                <h3>Aimbot</h3>
                <p>Advanced prediction, auto-fire & silent aim.</p>
            </div>
            <div class="func-card">
                <i class="fas fa-eye"></i>
                <h3>ESP (Visuals)</h3>
                <p>Player skeletons, health, boxes & snaplines.</p>
            </div>
            <div class="func-card">
                <i class="fas fa-shield-alt"></i>
                <h3>Exploits</h3>
                <p>No recoil, fast-reload & fly (use with caution).</p>
            </div>
        </div>

        <p class="status-tag Undetected">Undetected</p>

        <a href="index.html" class="back-link">← Вернуться назад</a>
    </div>

    <script>
        // Копируемparticles setup из index.html
        particlesJS('particles-js', {
            "particles": { "number": { "value": 80 }, "color": { "value": "#ffffff" }, "shape": { "type": "triangle" }, "line_linked": { "enable": true, "opacity": 0.2 } }
        });
    </script>
</body>
</html>
